<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bean's World</title>
  <meta name="description" content="A quiet storybook meadow where a little bean lives its own gentle life." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@500..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M52 8C79 8 90 30 89 54C88 81 72 96 50 96C27 96 12 82 12 58C12 42 21 37 23 27C26 15 36 8 52 8Z' fill='%23D99A72'/%3E%3C/svg%3E" />
</head>
<body data-time="day">
  <a class="skip-link" href="#main">Skip to Bean's meadow</a>
  <header class="top">
    <h1 class="brand">Bean's World</h1>
    <nav class="tabs" aria-label="Pages">
      <button class="tab" data-view="world" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18c3-5 6-7 9-7s6 2 9 7"/><circle cx="16.5" cy="6.5" r="2.5"/></svg>
        <span class="long">Bean's World</span><span class="short">World</span>
      </button>
      <button class="tab" data-view="diary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>
        <span>Diary</span>
      </button>
      <button class="tab" data-view="things">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span class="long">Bean's Things</span><span class="short">Things</span>
      </button>
    </nav>
  </header>

  <main id="main">
    <!-- VIEW 1: the meadow -->
    <section class="view view-world is-active" data-view="world" aria-labelledby="world-title">
      <h2 id="world-title" class="sr-only">Bean's meadow</h2>
      <div class="world-layout">
        <div class="scene" id="scene" role="img" aria-label="Bean's meadow">
          <img class="bg bg-day" src="assets/meadow-day.webp" alt="" width="1536" height="864" decoding="async" />
          <img class="bg bg-dusk" src="assets/meadow-dusk.webp" alt="" width="1536" height="864" decoding="async" />
          <div class="bean" id="bean"></div>
          <div class="zzz" id="zzz" aria-hidden="true">z<span>z</span></div>
        </div>

        <aside class="panel">
          <div class="bubble" id="caption-wrap">
            <p class="caption" id="caption" aria-live="polite">Bean is waking up…</p>
            <span class="bubble-dot d1" aria-hidden="true"></span>
            <span class="bubble-dot d2" aria-hidden="true"></span>
          </div>

          <div class="controls">
            <button class="big-btn" id="still-btn" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.5" height="12" rx="1.5"/><rect x="13.5" y="6" width="3.5" height="12" rx="1.5"/></svg>
              <span id="still-label">Still</span>
            </button>
            <button class="big-btn read-btn" id="read-btn" data-reads="world">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
              <span class="read-label">Read to me</span>
            </button>
          </div>

          <section class="needs" aria-labelledby="needs-title">
            <h3 id="needs-title" class="needs-title">How Bean is feeling inside</h3>
            <ul class="needs-list" id="needs" role="list"></ul>
          </section>
        </aside>
      </div>
    </section>

    <!-- VIEW 2: the diary -->
    <section class="view view-diary" data-view="diary" aria-labelledby="diary-title" hidden>
      <h2 id="diary-title" class="sr-only">Bean's diary</h2>
      <article class="book" id="diary-page" aria-live="polite">
        <figure class="page-picture">
          <img id="diary-img" src="" alt="" width="1200" height="800" decoding="async" />
        </figure>
        <div class="page-words">
          <p class="page-date" id="diary-date"></p>
          <h3 class="page-title" id="diary-heading"></h3>
          <p class="page-text" id="diary-text"></p>
        </div>
      </article>
      <div class="book-controls">
        <button class="big-btn" id="prev-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
          <span>Previous</span>
        </button>
        <button class="big-btn read-btn" data-reads="diary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <span class="read-label">Read to me</span>
        </button>
        <button class="big-btn" id="next-btn">
          <span>Next</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- VIEW 3: Bean's things -->
    <section class="view view-things" data-view="things" aria-labelledby="things-title" hidden>
      <div class="things-head">
        <h2 id="things-title" class="things-title">Bean's Things</h2>
        <button class="big-btn read-btn" data-reads="things">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <span class="read-label">Read to me</span>
        </button>
      </div>
      <div class="things-grid" id="things"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
